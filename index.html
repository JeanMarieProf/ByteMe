<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX Content Editor</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #xmlContentDisplay { width: 90%; height: 400px; margin-top: 10px; border: 1px solid #ccc; padding: 5px; }
        #messageArea { margin-top: 10px; padding: 10px; border: 1px solid transparent; }
        .success { border-color: green; background-color: #e6ffe6; color: green; }
        .error { border-color: red; background-color: #ffe6e6; color: red; }
    </style>
</head>
<body>
    <h1>DOCX Content Viewer</h1>
    <p>Select a .docx file to view its word/document.xml content.</p>

    <input type="file" id="docxFileInput" accept=".docx">
    <button id="loadButton">Load and Display word/document.xml</button>
    <button id="saveButton" style="display: none;">Save Modified DOCX</button>

    <h2>word/document.xml Content:</h2>
    <textarea id="xmlContentDisplay"></textarea>

    <h2>Messages:</h2>
    <div id="messageArea"></div>

    <!-- Scripts -->
    <!-- pako.js is imported by ZipEditor.js as a module -->
    <script type="module" src="ByteArray.js"></script>
    <script type="module" src="ZipEditor.js"></script>
    <script type="module" src="test.js" defer></script>
</body>
</html>
