<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Explorer Test</title>
    <!-- The CSS will be injected by archive_explorer.js -->
</head>
<body>
    <div id="app"></div>

    <!-- Ensure Endian is available for ByteArray and zip_parser -->
    <script>
        const Endian = {
            BIG_ENDIAN: "bigEndian",
            LITTLE_ENDIAN: "littleEndian"
        };
    </script>

    <script src="ByteArray.js"></script>
    <script src="zip_parser.js"></script>
    <script src="archive_explorer.js"></script>
    <script>
        // Wait for the DOM to be fully loaded before initializing
        document.addEventListener('DOMContentLoaded', () => {
            // A minimal ZIP file containing an empty "test.txt"
            // LFH (test.txt, empty, no compression) + CDFH (test.txt) + EOCD
            const zipFileBytes = new Uint8Array([
                0x50, 0x4B, 0x03, 0x04, 0x0A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0x00, 0x00, 0x00, 0x74, 0x65, 0x73, 0x74,
                0x2E, 0x74, 0x78, 0x74, // "test.txt"
                0x50, 0x4B, 0x01, 0x02, 0x1E, 0x03, 0x0A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x00, 0x00, 0x00, 0x00, 0x20, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x74, 0x65, 0x73, 0x74,
                0x2E, 0x74, 0x78, 0x74, // "test.txt"
                0x50, 0x4B, 0x05, 0x06, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00, 0x32, 0x00, 0x00, 0x00,
                0x2A, 0x00, 0x00, 0x00, 0x00, 0x00
            ]);

            const zipByteArray = new ByteArray(zipFileBytes.buffer);
            
            // initArchiveExplorer expects zipByteArray and targetDomElementId
            // zipByteArray is now a ByteArray instance
            initArchiveExplorer(zipByteArray, 'app');
        });
    </script>
</body>
</html>
